# Local : `docker compose up -d db` puis `npm run dev`
# Complet / Dokploy : `docker compose up -d --build`
services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?à définir}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-cours}
      MARIADB_USER: ${MARIADB_USER:-cours}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?à définir}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Applique les migrations Prisma puis s'arrête
  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: mysql://${MARIADB_USER:-cours}:${MARIADB_PASSWORD}@db:3306/${MARIADB_DATABASE:-cours}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://${MARIADB_USER:-cours}:${MARIADB_PASSWORD}@db:3306/${MARIADB_DATABASE:-cours}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?à définir}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      SIGNUP_ALLOWED_DOMAINS: ${SIGNUP_ALLOWED_DOMAINS:-}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:

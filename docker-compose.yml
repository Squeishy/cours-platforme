# BRANCHE `test` — déploiement de test sur Dokploy, avec les comptes et données de DÉMO
# (mot de passe « demo-password-2026 », voir README). Ne jamais déployer cette branche pour de vrais utilisateurs.
# Dokploy : ce fichier seul ; domaine rattaché au service `app`, port 3000 (routé par Traefik)
services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?à définir}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-cours}
      MARIADB_USER: ${MARIADB_USER:-cours}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?à définir}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db-data:/var/lib/mysql
    # Pas de port publié : évite le conflit avec la base de la prod sur le même serveur
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Applique les migrations Prisma, charge le référentiel et les données de démo, puis s'arrête
  migrate:
    build:
      context: .
      target: seeder
    environment:
      DATABASE_URL: mysql://${MARIADB_USER:-cours}:${MARIADB_PASSWORD}@db:3306/${MARIADB_DATABASE:-cours}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
      args:
        PEERTUBE_HOSTS: ${PEERTUBE_HOSTS:-}
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://${MARIADB_USER:-cours}:${MARIADB_PASSWORD}@db:3306/${MARIADB_DATABASE:-cours}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?à définir}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      SIGNUP_ALLOWED_DOMAINS: ${SIGNUP_ALLOWED_DOMAINS:-}
      PEERTUBE_HOSTS: ${PEERTUBE_HOSTS:-}
      LINK_CHECK_ALLOW_HOSTS: ${LINK_CHECK_ALLOW_HOSTS:-}
      PORT: 3000
    # Pas de port publié sur l'hôte : 3000 y est déjà pris par Dokploy (voir docker-compose.local.yml)
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
